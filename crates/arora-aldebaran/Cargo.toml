[package]
name = "arora-aldebaran"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/semio-ai/arora-aldebaran"
description = "Runs Aldebaran robots (NAO, Pepper) as Arora devices, through the HAL the build selects"

[lib]
name = "arora_aldebaran"

# The device runner: connects to a robot and runs it as an Arora device.
[[bin]]
name = "arora-aldebaran"
path = "src/bin/arora-aldebaran.rs"

[features]
default = ["naoqi"]
# The HAL the device drives the robot with; a build selects exactly one.
# `naoqi`: NAOqi's services over the network (ALMotion, ALMemory...), arora-hal-naoqi.
naoqi = ["dep:arora-hal-naoqi"]
# The Semio Studio connection (arora's `studio-bridge`): the runner connects to Studio
# unless the run passes `--no-studio`.
studio = ["arora/studio-bridge"]

[dependencies]
anyhow = "1"
# 16: `AroraBuilder::with_studio` and `studio::StudioArgs`, the run's Studio
# choice, a run of a runner built with Studio connecting unless it passes
# `--no-studio`; `RunnerArgs::device` and `AroraBuilder::with_device`, the
# device's name, directory and local bridge port.
arora = "17"
arora-behavior = "10"
arora-hal = "4"
arora-hal-naoqi = { path = "../arora-hal-naoqi", version = "0.3", optional = true }
arora-module = "2.1"
arora-simple-data-store = "3.1"
arora-types = "3"
# The runner's command line; `env` reads the robot from `ROBOT`.
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
log = "0.4"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
# The fake NAOqi the device tests run the robot against.
fake-naoqi = { path = "../fake-naoqi" }
