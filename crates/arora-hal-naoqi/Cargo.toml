[package]
name = "arora-hal-naoqi"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/semio-ai/arora-aldebaran"
description = "NAOqi HAL for Arora: NAO and Pepper robots as Arora HALs, through the qi framework (libqi-rs) and ALMotion"

[lib]
name = "arora_hal_naoqi"

[dependencies]
arora-behavior = "10"
arora-hal = "4"
arora-module = "2.1"
arora-types = "3"
async-trait = "0.1"
futures = "0.3"
log = "0.4"
# The Rust implementation of the qi framework (libqi), the NAOqi middleware. The package is
# `libqi-vibe`; the library is used as `qi`.
qi = { package = "libqi-vibe", version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# rt, time, sync, macros: the sensor sampling, queued-write and voice tasks run on the
# caller's runtime; rt-multi-thread: dropping the HAL waits for the robot to stop and rest
# (`block_in_place`) on a multi-threaded runtime.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }

[dev-dependencies]
# The fake NAOqi the tests drive the HAL against.
fake-naoqi = { path = "../fake-naoqi" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
