[workspace]
resolver = "2"

members = [
  "crates/arora-aldebaran",
  "crates/arora-hal-naoqi",
  "crates/arora-hal-naoqi-dcm",
  "crates/arora-naoqi-module",
  "crates/fake-naoqi",
]

[profile.release]
lto = "thin"
debug = 1

# The library NAOqi loads on a robot (crates/arora-naoqi-module/robot/build.sh): optimized for
# size, for the robot's disk and memory (41 MB rather than 62 with release, i686). Panics
# still unwind: the plugin catches them, so that a panic disables the plugin rather than
# abort NAOqi.
[profile.robot]
inherits = "release"
opt-level = "s"
debug = false
strip = true
lto = "fat"
codegen-units = 1

# The interpreter WebAssembly modules run on where Cranelift has no backend (the NAO's
# 32-bit x86): optimized for speed.
[profile.robot.package.pulley-interpreter]
opt-level = 3

# The module support of libqi-vibe (`qi::module`, its DCM plugins), merged on its main and not
# released yet: `arora-hal-naoqi-dcm` and `arora-naoqi-module` need it, and every crate of the
# workspace builds with the same libqi-vibe, so that their qi types are one.
[patch.crates-io]
libqi-vibe = { git = "https://github.com/victorpaleologue/libqi-rs-vibe", rev = "e92e74ec27077225d990125f483af51f968b32e1" }
libqi-macros-vibe = { git = "https://github.com/victorpaleologue/libqi-rs-vibe", rev = "e92e74ec27077225d990125f483af51f968b32e1" }
