name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  # Daily, against arora-sdk's main (the `arora-sdk-main` job below).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables are enough for a failing test's backtrace, and keep the linked
  # runtimes within the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The workspace with its default HAL (`naoqi`), then the runner with its Semio
  # Studio connection (arora-aldebaran's `studio`): the tests, the HAL's and the
  # device's against a fake NAOqi, run in each.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      # Dependencies only: workspace members always rebuild. Main saves the
      # cache, pull requests restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (studio)
        run: cargo clippy --workspace --all-targets --features arora-aldebaran/studio -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --workspace

      - name: Test (studio)
        run: cargo test -p arora-aldebaran --features studio --bins

  # The NAO cross-build of `arora-aldebaran` is not exercised here: it takes a
  # cross toolchain and half an hour. See README.md#deploy-it-on-the-robot.

  # The crates against arora-sdk's main rather than the published Arora crates, so a
  # change there that breaks the HAL shows before it is released. Daily and on
  # demand it gates; on a pull request it only reports, as arora-sdk's main may be
  # broken for reasons the pull request has nothing to do with.
  arora-sdk-main:
    if: github.event_name != 'push'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # arora-sdk's manifests declare artifact dependencies (dev-only), which cargo
      # parses only with bindeps on.
      CARGO_UNSTABLE_BINDEPS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: semio-ai/arora-sdk
          ref: main
          path: arora-sdk

      - name: Use arora-sdk's toolchain and crates
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' arora-sdk/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          # Fails when an arora-sdk crate still resolves from crates.io, its version
          # past this workspace's requirement: that crate would go untested.
          RUSTUP_TOOLCHAIN=$channel .github/scripts/patch-arora-sdk.sh arora-sdk
          echo "arora-sdk $(git -C arora-sdk rev-parse --short HEAD), toolchain $channel" >> "$GITHUB_STEP_SUMMARY"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (studio)
        run: cargo clippy --workspace --all-targets --features arora-aldebaran/studio -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test (studio)
        run: cargo test -p arora-aldebaran --features studio --bins

  markdown-link-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the links in every Markdown file
        run: |
          npm install --global markdown-link-check@3.13.7
          failed=0
          while IFS= read -r -d '' file; do
            markdown-link-check --quiet \
              --config .github/workflows/markdown-link-check-config.json "$file" || failed=1
          done < <(find . -type f -name '*.md' -not -path './node_modules/*' -print0)
          exit "$failed"
