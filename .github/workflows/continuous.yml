name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables are enough for a failing test's backtrace, and keep the linked
  # runtimes within the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The workspace with its default HAL (`naoqi`), then the runner with its Semio
  # Studio connection (arora-aldebaran's `studio`): the tests, the HAL's and the
  # device's against a fake NAOqi, run in each.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      # Dependencies only: workspace members always rebuild. Main saves the
      # cache, pull requests restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (studio)
        run: cargo clippy --workspace --all-targets --features arora-aldebaran/studio -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      # A workspace build unifies the crates' features, which can hide a feature a
      # crate needs and does not declare: each published crate builds on its own.
      - name: Build each crate alone
        run: |
          cargo build -p arora-hal-naoqi
          cargo build -p arora-hal-naoqi-dcm
          cargo build -p arora-aldebaran
          cargo build -p arora-naoqi-module

      - name: Test
        run: cargo test --workspace

      - name: Test (studio)
        run: cargo test -p arora-aldebaran --features studio --bins

      # The library NAOqi loads, with its bridge to the DCM, in a fake NAOqi: the stub of the
      # NAOqi C++ SDK (from libqi-rs-vibe) needs the Boost headers.
      - name: Test in a fake NAOqi
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev
          interop/fake-dcm/build.sh
          ARORA_INTEROP_REQUIRE=1 cargo test -p arora-naoqi-module --test fake_dcm

  # The NAO cross-builds of `arora-aldebaran` and of the library NAOqi loads are not
  # exercised here: they take a cross toolchain (and the NAOqi C++ SDK) and half an hour.
  # See README.md#deploy-it-on-the-robot and README.md#build-it.

  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the links in every Markdown file
        run: |
          npm install --global markdown-link-check@3.15.0
          failed=0
          while IFS= read -r -d '' file; do
            markdown-link-check --quiet \
              --config .github/workflows/markdown-link-check-config.json "$file" || failed=1
          done < <(find . -type f -name '*.md' -not -path './node_modules/*' -print0)
          exit "$failed"
